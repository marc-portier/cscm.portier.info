<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="47" fill="#F0F9FF" stroke="#0284C7" stroke-width="3.5"/>
  <!-- Horizontal water & shadow bands -->
    <rect x="8" y="57" width="84" height="6" rx="2" fill="#BAE6FD"/>
    <rect x="10" y="63" width="80" height="5" rx="2" fill="#CBD5E1"/>
    <!-- Tether cord connecting buoy to swimmer -->
    <path d="M 37 54 L 46 57" stroke="#0F2C4C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bright Fluo Pink Tow-Float (Zwemboei) on the left -->
