<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="47" fill="#F0F9FF" stroke="#0284C7" stroke-width="3.5"/>
  <!-- Map Location Pin Silhouette -->
    <path d="M 50 92 C 42 77, 20 55, 20 37 A 30 30 0 1 1 80 37 C 80 55, 58 77, 50 92 Z"
          fill="#94A3B8" stroke="#0F2C4C" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner White Circle -->
    <circle cx="50" cy="37" r="21" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="2.2"/>
    <!-- Belgian Lifeguard Mirador / High Chair inside pin -->
    <g stroke="#0F2C4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- High chair backrest / seat -->
      <path d="M 43 22 L 57 22 L 55 29 L 45 29 Z" fill="#F8FAFC"/>
      <line x1="47" y1="22" x2="47" y2="29"/>
      <line x1="50" y1="22" x2="50" y2="29"/>
      <line x1="53" y1="22" x2="53" y2="29"/>
      <!-- Side armrests / horns -->
      <path d="M 38 27 L 62 27 M 38 27 L 40 25 M 62 27 L 60 25" fill="none"/>
      <!-- Slatted platform -->
      <path d="M 41 32 L 59 32 L 62 38 L 38 38 Z" fill="#FEF3C7"/>
      <line x1="45" y1="32" x2="43" y2="38"/>
      <line x1="50" y1="32" x2="50" y2="38"/>
      <line x1="55" y1="32" x2="57" y2="38"/>
      <!-- Support legs & crossbars -->
      <line x1="43" y1="38" x2="39" y2="52"/>
      <line x1="57" y1="38" x2="60" y2="52"/>
      <line x1="54" y1="38" x2="54" y2="50"/>
      <line x1="41" y1="45" x2="58" y2="45"/>
      <!-- Lifebuoy (Reddingsboei) mounted on left leg -->
      <circle cx="42" cy="44" r="5.5" fill="#F97316" stroke="#0F2C4C" stroke-width="1.8"/>
      <circle cx="42" cy="44" r="2.2" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    </g>
</svg>
