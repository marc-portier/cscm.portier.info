<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="47" fill="#FFF1F2" stroke="#E11D48" stroke-width="3.5"/>
  <!-- Anchor line pulled taut at an angle by the current -->
    <path d="M 34 53 L 43 90" fill="none" stroke="#0F2C4C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="34" cy="53" r="2.8" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="2"/>
    <!-- Big Yellow Marker Buoy floating on surface -->
    <ellipse cx="32" cy="34" rx="11" ry="14" fill="#FACC15" stroke="#0F2C4C" stroke-width="2.6"/>
    <ellipse cx="29" cy="31" rx="4" ry="6" fill="#FEF08A" opacity="0.7"/>
    <line x1="33" y1="48" x2="34" y2="51" stroke="#0F2C4C" stroke-width="2.5"/>
    <!-- Swimmer floating in water holding line / testing drift -->
    <g stroke="#0F2C4C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Head with goggles -->
      <circle cx="52" cy="43" r="5.5" fill="#FFFFFF"/>
      <path d="M 47 41 Q 52 39, 57 42" fill="none" stroke-width="2.5"/>
      <!-- Floating body stretched to the right with current -->
      <ellipse cx="66" cy="50" rx="12" ry="4.5" fill="#E2E8F0"/>
      <!-- Arm reaching out -->
      <path d="M 56 46 L 76 42" fill="none"/>
      <circle cx="77" cy="42" r="1.8" fill="#FFFFFF"/>
    </g>
    <!-- Water surface waves -->
    <path d="M 10 50 Q 30 46, 50 50 T 92 49" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 12 56 Q 35 52, 58 56 T 90 55" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
</svg>
