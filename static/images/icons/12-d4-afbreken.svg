<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="47" fill="#FFF1F2" stroke="#E11D48" stroke-width="3.5"/>
  <!-- Sea surf lines on the upper-left & diagonal shoreline -->
    <path d="M 14 78 C 24 66, 30 62, 38 56 C 44 50, 48 44, 58 38" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 22 84 C 32 72, 40 68, 46 60 C 52 52, 56 48, 64 43" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <line x1="28" y1="36" x2="54" y2="36"/>
      <line x1="22" y1="43" x2="46" y2="43"/>
      <line x1="18" y1="50" x2="39" y2="50"/>
      <line x1="12" y1="57" x2="32" y2="57"/>
      <line x1="10" y1="64" x2="25" y2="64"/>
    </g>
    <!-- Swimmer walking/jogging away on the dry beach (right side) -->
    <g stroke="#0F2C4C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Head with swim cap & goggles on forehead -->
      <ellipse cx="72" cy="33" rx="4.5" ry="5.5" fill="#FFFFFF" transform="rotate(15 72 33)"/>
      <path d="M 69 29 L 77 30 M 71 27 L 76 28" stroke-width="3"/>
      <!-- Leaning torso -->
      <path d="M 69 39 L 62 56 L 68 57 L 72 40 Z" fill="#FFFFFF"/>
      <!-- Swim trunks -->
      <path d="M 61 55 L 69 56 L 68 65 L 60 64 Z" fill="#1E293B"/>
      <!-- Swinging arms -->
      <path d="M 71 42 L 79 44 M 69 45 L 76 51" fill="none"/>
      <circle cx="80" cy="44" r="1.6" fill="#FFFFFF"/>
      <circle cx="77" cy="51" r="1.6" fill="#FFFFFF"/>
      <!-- Striding legs -->
      <path d="M 62 64 L 56 76 L 49 82" fill="none"/>
      <path d="M 67 64 L 73 70 L 70 79" fill="none"/>
      <ellipse cx="48" cy="83" rx="2.5" ry="1.5" fill="#FFFFFF"/>
      <ellipse cx="69" cy="80" rx="2" ry="1.5" fill="#FFFFFF"/>
    </g>
</svg>
