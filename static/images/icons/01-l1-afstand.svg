<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="47" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3.5"/>
  <!-- Water wave ribbon behind infinity loop -->
    <path d="M 6 54 C 22 40, 38 68, 50 54 C 62 40, 78 68, 94 54" fill="none" stroke="#BAE6FD" stroke-width="8" stroke-linecap="round"/>
    <!-- Infinity loop (∞) -->
    <path d="M 50 52 C 38 34, 14 34, 14 52 C 14 70, 38 70, 50 52 C 62 34, 86 34, 86 52 C 86 70, 62 70, 50 52 Z"
          fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Streamlined front-crawl swimmer gliding horizontally across the middle -->
    <g fill="none" stroke="#0F2C4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Extended front arm & torso & legs -->
      <path d="M 16 51 L 46 50 C 56 48, 66 48, 76 50 L 90 52"/>
      <!-- Lower body / kick -->
      <path d="M 16 51 L 14 57 M 22 55 L 44 54"/>
      <!-- Recovery arm arched over water -->
      <path d="M 58 49 C 65 37, 74 37, 84 48 L 87 53"/>
      <!-- Head with swim cap -->
      <ellipse cx="72" cy="46" rx="5.5" ry="4" fill="#F59E0B" stroke="#0F2C4C" stroke-width="2.5"/>
    </g>
    <!-- +800m and +15' badges -->
    <text x="50" y="22" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0F2C4C" text-anchor="middle">+800m</text>
    <text x="50" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#B45309" text-anchor="middle">+15'</text>
</svg>
